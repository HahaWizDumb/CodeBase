<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Blue Flame VTuber Rig v2 (drawn mouth)</title>
<style>
  :root {
    --panel-bg: rgba(20,22,30,0.82);
    --accent: #6cf0ff;
    --text: #e8f6ff;
  }
  html,body {
    margin:0; padding:0; height:100%;
    background: #1a1c22;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    overflow:hidden;
  }
  #app { display:flex; height:100vh; width:100vw; }
  #stageWrap {
    flex:1; display:flex; align-items:center; justify-content:center;
    position:relative;
    background-image:
      linear-gradient(45deg, #2a2d36 25%, transparent 25%),
      linear-gradient(-45deg, #2a2d36 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2d36 75%),
      linear-gradient(-45deg, transparent 75%, #2a2d36 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    background-color: #1e2027;
  }
  #stageWrap.solidbg { background: #17181c; }
  #stage { image-rendering: -webkit-optimize-contrast; display:block; }
  #panel {
    width: 300px; flex-shrink:0;
    background: var(--panel-bg);
    padding: 18px; box-sizing:border-box; overflow-y:auto;
    border-left: 1px solid rgba(255,255,255,0.08);
  }
  #panel h1 { font-size: 16px; margin: 0 0 4px 0; color: var(--accent); letter-spacing: 0.5px; }
  #panel .sub { font-size: 11px; opacity: 0.6; margin-bottom:18px; }
  .group { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .group:last-child { border-bottom:none; }
  .group label { display:flex; justify-content:space-between; font-size: 12px; margin-bottom: 6px; opacity:0.85; }
  .group input[type=range] { width:100%; accent-color: var(--accent); }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  button {
    background: rgba(108,240,255,0.12); border: 1px solid var(--accent); color: var(--accent);
    padding: 9px 12px; border-radius: 6px; cursor:pointer; font-size: 12.5px; flex:1;
    transition: background 0.15s;
  }
  button:hover { background: rgba(108,240,255,0.25); }
  #status {
    font-size: 11.5px; padding: 8px 10px; border-radius: 6px;
    background: rgba(255,255,255,0.05); margin-bottom:16px; line-height:1.5;
  }
  #status.ok { color:#8bffa8; }
  #status.err { color:#ff8b8b; }
  .checkboxrow { display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:8px; }
  video#cam { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="stage" width="686" height="762" style="width:686px;height:762px;"></canvas>
  </div>
  <div id="panel">
    <h1>BLUE FLAME RIG <span style="opacity:0.5;font-size:11px;">v2</span></h1>
    <div class="sub">Drawn vampire mouth + eyelid blink &middot; OBS-ready</div>

    <div id="status">Click Start to enable your webcam.</div>

    <div class="row">
      <button id="btnStart">Start Camera</button>
      <button id="btnRecal">Recalibrate</button>
    </div>
    <div class="checkboxrow"><input type="checkbox" id="chkMirror" checked><label for="chkMirror">Mirror</label></div>
    <div class="checkboxrow"><input type="checkbox" id="chkSolidBg"><label for="chkSolidBg">Solid background (vs transparent grid)</label></div>
    <div class="checkboxrow"><input type="checkbox" id="chkDebug"><label for="chkDebug">Show debug overlay</label></div>

    <div class="group">
      <label>Eyebrow sensitivity <span id="vBrow">100%</span></label>
      <input type="range" id="sBrow" min="0" max="200" value="100">
      <label>Blink sensitivity <span id="vBlink">100%</span></label>
      <input type="range" id="sBlink" min="0" max="200" value="100">
      <label>Eye gaze range <span id="vGaze">100%</span></label>
      <input type="range" id="sGaze" min="0" max="200" value="100">
      <label>Head sway amount <span id="vHead">100%</span></label>
      <input type="range" id="sHead" min="0" max="200" value="100">
      <label>Idle bob (nose) <span id="vBob">100%</span></label>
      <input type="range" id="sBob" min="0" max="200" value="100">
    </div>

    <div class="group">
      <label>Mouth open sensitivity <span id="vJaw">100%</span></label>
      <input type="range" id="sJaw" min="0" max="200" value="100">
      <label>Fang length <span id="vFang">100%</span></label>
      <input type="range" id="sFang" min="40" max="180" value="100">
      <label>Mouth width <span id="vMouthW">100%</span></label>
      <input type="range" id="sMouthW" min="60" max="160" value="100">
    </div>

    <div class="sub">Upper lip/fangs stay fixed; the jaw drops open based on your real jaw movement. Fangs poke out slightly even closed, for the vampire smirk.</div>
  </div>
</div>

<video id="cam" autoplay playsinline muted></video>

const images = {};
async function loadImages() {
  const entries = Object.entries(LAYER_SRC);
  await Promise.all(entries.map(([k,src]) => new Promise((res) => {
    const img = new Image();
    img.onload = () => { images[k] = img; res(); };
    img.src = src;
  })));
}

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const video = document.getElementById('cam');
const statusEl = document.getElementById('status');

let faceLandmarker = null;
let running = false;
let lastVideoTime = -1;
let latestResult = null;

let neutral = { roll:0, yaw:0, pitch:0, samples:0, done:false };

const rig = {
  roll:0, yaw:0, pitch:0,
  browL:0, browR:0,
  blink:0, gazeX:0, gazeY:0,
  jaw:0
};

function lerp(a,b,t) { return a + (b-a)*t; }
function getBlend(cats, name) {
  if (!cats) return 0;
  const c = cats.find(c => c.categoryName === name);
  return c ? c.score : 0;
}

async function setupFaceLandmarker() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: false,
    runningMode: "VIDEO",
    numFaces: 1
  });
}

async function startCamera() {
  statusEl.textContent = "Requesting camera...";
  statusEl.className = "";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width:640, height:480 }, audio:false });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = "Loading face model...";
    if (!faceLandmarker) await setupFaceLandmarker();
    running = true;
    statusEl.textContent = "Tracking. Hold still a moment for calibration...";
    statusEl.className = "ok";
    neutral = { roll:0, yaw:0, pitch:0, samples:0, done:false };
    requestAnimationFrame(loop);
  } catch (e) {
    statusEl.textContent = "Camera/model error: " + e.message;
    statusEl.className = "err";
    console.error(e);
  }
}

function computeHeadPose(lm) {
  const L = lm[33], R = lm[263], nose = lm[4];
  const roll = Math.atan2(R.y - L.y, R.x - L.x);
  const midX = (L.x + R.x)/2, midY = (L.y + R.y)/2;
  const eyeDist = Math.hypot(R.x-L.x, R.y-L.y) || 0.001;
  const yaw = (nose.x - midX) / eyeDist;
  const pitch = (nose.y - midY) / eyeDist;
  return { roll, yaw, pitch };
}

function updateCalibration(pose) {
  if (neutral.samples < 30) {
    neutral.roll = (neutral.roll*neutral.samples + pose.roll)/(neutral.samples+1);
    neutral.yaw = (neutral.yaw*neutral.samples + pose.yaw)/(neutral.samples+1);
    neutral.pitch = (neutral.pitch*neutral.samples + pose.pitch)/(neutral.samples+1);
    neutral.samples++;
    if (neutral.samples === 30) {
      neutral.done = true;
      statusEl.textContent = "Calibrated. You're live.";
    }
  }
}

function getSliderVal(id) { return parseFloat(document.getElementById(id).value); }

function loop() {
  if (!running) return;
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const t = performance.now();
    latestResult = faceLandmarker.detectForVideo(video, t);
  }
  render();
  requestAnimationFrame(loop);
}

// draws the vampire mouth centered at (cx,cy) in current transform space
function drawVampireMouth(ctx, cx, cy, w, h, openAmt, fangScale) {
  // openAmt: 0 (closed) .. 1 (fully open)
  const halfW = w/2;
  const topY = cy - h*0.28;                 // fixed upper lip line
  const restBottomY = cy + h*0.22;          // closed lower lip
  const openBottomY = cy + h*1.35;          // dropped jaw position at full open
  const bottomY = restBottomY + (openBottomY-restBottomY)*openAmt;
  const sideY = cy - h*0.05 + ( (topY-(cy-h*0.05)) * 0 ); // corners roughly mid

  ctx.save();

  // mouth cavity shape
  ctx.beginPath();
  ctx.moveTo(cx-halfW, topY+2);
  ctx.quadraticCurveTo(cx, topY - h*0.15 - openAmt*1.5, cx+halfW, topY+2);
  ctx.quadraticCurveTo(cx+halfW*1.05, (topY+bottomY)/2, cx+halfW*0.7, bottomY);
  ctx.quadraticCurveTo(cx, bottomY + h*0.12*openAmt, cx-halfW*0.7, bottomY);
  ctx.quadraticCurveTo(cx-halfW*1.05, (topY+bottomY)/2, cx-halfW, topY+2);
  ctx.closePath();

  const grad = ctx.createLinearGradient(cx, topY, cx, bottomY);
  grad.addColorStop(0, '#5c0f14');
  grad.addColorStop(0.5, '#2b0507');
  grad.addColorStop(1, '#170203');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = '#120202';
  ctx.stroke();

  // fangs (fixed to upper lip, hang down into the opening)
  const fangW = w*0.16;
  const fangLen = (h*0.95 + openAmt*h*0.35) * fangScale;
  const fangPairOffset = halfW*0.42;
  function fang(fx) {
    const baseY = topY + 3;
    ctx.beginPath();
    ctx.moveTo(fx-fangW/2, baseY);
    ctx.lineTo(fx+fangW/2, baseY);
    ctx.lineTo(fx, baseY+fangLen);
    ctx.closePath();
    const fg = ctx.createLinearGradient(fx,baseY,fx,baseY+fangLen);
    fg.addColorStop(0, '#fbf6ea');
    fg.addColorStop(1, '#e7ddc4');
    ctx.fillStyle = fg;
    ctx.fill();
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = '#9c8f6c';
    ctx.stroke();
  }
  fang(cx-fangPairOffset);
  fang(cx+fangPairOffset);

  // upper lip line on top to seat the fangs naturally
  ctx.beginPath();
  ctx.moveTo(cx-halfW, topY+2);
  ctx.quadraticCurveTo(cx, topY - h*0.15 - openAmt*1.5, cx+halfW, topY+2);
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = '#1c0304';
  ctx.stroke();

  ctx.restore();
}

function render() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.scale(SCALE, SCALE);

  const mirrorOn = document.getElementById('chkMirror').checked;
  const browSens = getSliderVal('sBrow')/100;
  const blinkSens = getSliderVal('sBlink')/100;
  const gazeSens = getSliderVal('sGaze')/100;
  const headSens = getSliderVal('sHead')/100;
  const bobSens = getSliderVal('sBob')/100;
  const jawSens = getSliderVal('sJaw')/100;
  const fangScale = getSliderVal('sFang')/100;
  const mouthWScale = getSliderVal('sMouthW')/100;

  let brow=0, blink=0, gazeX=0, gazeY=0, headRoll=0, headYaw=0, headPitch=0, jawOpen=0, haveFace=false;

  if (latestResult && latestResult.faceLandmarks && latestResult.faceLandmarks.length > 0) {
    haveFace = true;
    const lm = latestResult.faceLandmarks[0];
    const bs = latestResult.faceBlendshapes && latestResult.faceBlendshapes[0]
      ? latestResult.faceBlendshapes[0].categories : null;

    const blinkL = getBlend(bs,'eyeBlinkLeft');
    const blinkR = getBlend(bs,'eyeBlinkRight');
    blink = (blinkL+blinkR)/2;

    const browUp = (getBlend(bs,'browInnerUp') + getBlend(bs,'browOuterUpLeft') + getBlend(bs,'browOuterUpRight'))/3;
    const browDown = (getBlend(bs,'browDownLeft') + getBlend(bs,'browDownRight'))/2;
    brow = browUp - browDown;

    const gx = ((getBlend(bs,'eyeLookOutLeft') - getBlend(bs,'eyeLookInLeft')) +
                (getBlend(bs,'eyeLookInRight') - getBlend(bs,'eyeLookOutRight'))) / 2;
    const gy = ((getBlend(bs,'eyeLookDownLeft') - getBlend(bs,'eyeLookUpLeft')) +
                (getBlend(bs,'eyeLookDownRight') - getBlend(bs,'eyeLookUpRight'))) / 2;
    gazeX = gx; gazeY = gy;

    jawOpen = getBlend(bs,'jawOpen');

    const pose = computeHeadPose(lm);
    updateCalibration(pose);
    headRoll = pose.roll - neutral.roll;
    headYaw = pose.yaw - neutral.yaw;
    headPitch = pose.pitch - neutral.pitch;
  }

  rig.browL = lerp(rig.browL, brow, 0.35);
  rig.browR = lerp(rig.browR, brow, 0.35);
  rig.blink = lerp(rig.blink, blink, 0.55);
  rig.gazeX = lerp(rig.gazeX, gazeX, 0.25);
  rig.gazeY = lerp(rig.gazeY, gazeY, 0.25);
  rig.roll = lerp(rig.roll, headRoll, 0.15);
  rig.yaw = lerp(rig.yaw, headYaw, 0.15);
  rig.pitch = lerp(rig.pitch, headPitch, 0.15);
  rig.jaw = lerp(rig.jaw, jawOpen, 0.4);

  const cx = CANVAS_W/2, cy = CANVAS_H*0.42;
  ctx.save();
  if (mirrorOn) { ctx.translate(CANVAS_W,0); ctx.scale(-1,1); }

  ctx.translate(cx, cy);
  ctx.rotate(rig.roll * headSens);
  ctx.translate(-cx, -cy);
  ctx.translate(rig.yaw * -40 * headSens, rig.pitch * -30 * headSens);

  // body
  ctx.drawImage(images.body, 0, 0, CANVAS_W, CANVAS_H);

  // nose idle bob
  const t = performance.now()/1000;
  const bob = Math.sin(t*1.4) * 2.2 * bobSens;
  const [noseOx, noseOy] = OFFSETS.nose;
  ctx.drawImage(images.nose, noseOx, noseOy + bob, DIMS.nose[0], DIMS.nose[1]);

  // vampire mouth (drawn, behind eyebrows/eye is fine since it doesn't overlap them)
  const jawAmt = Math.min(1, rig.jaw * jawSens * 1.4);
  drawVampireMouth(ctx, MOUTH.cx, MOUTH.cy, MOUTH.w*mouthWScale, MOUTH.h, jawAmt, fangScale);

  // eyebrows
  const browMove = -8 * browSens;
  const [ebrOx, ebrOy] = OFFSETS.eyebrow_right;
  ctx.save();
  ctx.translate(0, rig.browR*browMove);
  ctx.drawImage(images.eyebrow_right, ebrOx, ebrOy, DIMS.eyebrow_right[0], DIMS.eyebrow_right[1]);
  ctx.restore();

  const [eblOx, eblOy] = OFFSETS.eyebrow_left;
  ctx.save();
  ctx.translate(0, rig.browL*browMove);
  ctx.drawImage(images.eyebrow_left, eblOx, eblOy, DIMS.eyebrow_left[0], DIMS.eyebrow_left[1]);
  ctx.restore();

  // eye: TRUE eyelid-style blink via clipping (not squish) + gaze translate
  const [eyeOx, eyeOy] = OFFSETS.eye;
  const eyeW = DIMS.eye[0], eyeH = DIMS.eye[1];
  const eyeCx = eyeOx + eyeW/2, eyeCy = eyeOy + eyeH/2;
  const gazeDX = rig.gazeX * 7 * gazeSens;
  const gazeDY = rig.gazeY * 5 * gazeSens;

  const closeAmt = Math.min(1, rig.blink*blinkSens);
  const visibleHalfH = (eyeH/2) * (1-closeAmt);

  ctx.save();
  ctx.beginPath();
  ctx.rect(eyeOx-2, eyeCy-visibleHalfH, eyeW+4, Math.max(visibleHalfH*2, 0.001));
  ctx.clip();
  ctx.translate(gazeDX, gazeDY);
  ctx.drawImage(images.eye, eyeOx, eyeOy, eyeW, eyeH);
  ctx.restore();

  ctx.restore(); // mirror + head transform

  if (document.getElementById('chkDebug').checked) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(4,4,150,96);
    ctx.fillStyle = '#8bffa8';
    ctx.font = '10px monospace';
    ctx.fillText('face: ' + (haveFace?'yes':'NO'), 10, 18);
    ctx.fillText('blink: ' + rig.blink.toFixed(2), 10, 32);
    ctx.fillText('brow: ' + rig.browL.toFixed(2), 10, 46);
    ctx.fillText('gaze: ' + rig.gazeX.toFixed(2)+','+rig.gazeY.toFixed(2), 10, 60);
    ctx.fillText('jaw: ' + rig.jaw.toFixed(2), 10, 74);
    ctx.fillText('roll/yaw/pitch: ' + rig.roll.toFixed(2)+' '+rig.yaw.toFixed(2)+' '+rig.pitch.toFixed(2), 10, 88);
  }

  ctx.restore();
}

document.getElementById('btnStart').addEventListener('click', () => { if (!running) startCamera(); });
document.getElementById('btnRecal').addEventListener('click', () => {
  neutral = { roll:0, yaw:0, pitch:0, samples:0, done:false };
  statusEl.textContent = "Recalibrating... hold still.";
  statusEl.className = "ok";
});
document.getElementById('chkSolidBg').addEventListener('change', (e) => {
  document.getElementById('stageWrap').classList.toggle('solidbg', e.target.checked);
});

const sliderPairs = [
  ['sBrow','vBrow'], ['sBlink','vBlink'], ['sGaze','vGaze'],
  ['sHead','vHead'], ['sBob','vBob'], ['sJaw','vJaw'],
  ['sFang','vFang'], ['sMouthW','vMouthW']
];
for (const [s,v] of sliderPairs) {
  const sl = document.getElementById(s), lbl = document.getElementById(v);
  sl.addEventListener('input', () => lbl.textContent = sl.value + '%');
}

loadImages().then(() => {
  ctx.save(); ctx.scale(SCALE,SCALE);
  ctx.drawImage(images.body, 0, 0, CANVAS_W, CANVAS_H);
  drawVampireMouth(ctx, MOUTH.cx, MOUTH.cy, MOUTH.w, MOUTH.h, 0, 1);
  const [ebrOx, ebrOy] = OFFSETS.eyebrow_right; ctx.drawImage(images.eyebrow_right, ebrOx, ebrOy, DIMS.eyebrow_right[0], DIMS.eyebrow_right[1]);
  const [eblOx, eblOy] = OFFSETS.eyebrow_left; ctx.drawImage(images.eyebrow_left, eblOx, eblOy, DIMS.eyebrow_left[0], DIMS.eyebrow_left[1]);
  const [eyeOx, eyeOy] = OFFSETS.eye; ctx.drawImage(images.eye, eyeOx, eyeOy, DIMS.eye[0], DIMS.eye[1]);
  const [noseOx, noseOy] = OFFSETS.nose; ctx.drawImage(images.nose, noseOx, noseOy, DIMS.nose[0], DIMS.nose[1]);
  ctx.restore();
});
</script>
